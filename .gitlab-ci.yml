# GitLab is where orbit-site is developed: branches, merge requests and
# the dev -> main promotion happen here, and this file is the CI that
# gates them. GitHub tomlawesome/orbit-site is a push mirror GitLab updates
# after every merge (configured by the owner in the project settings, not
# here), and GitHub Pages serves `main` from what arrives: the mirror push
# is the release. GitHub keeps CodeQL. The model is in the
# gitlab-first-migration skill; the plan is docs/plans/gitlab-migration.md.
#
# Runner lanes (ai/agent-infra#3): `light` is 4 CPU / 6 GB, one hour.
# Nothing here needs Docker or `big`.

stages:
  - lint
  - live
  - maintenance
  - publish

default:
  tags: [light]
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Tags publish nothing here: Pages serves a branch.
    - if: $CI_COMMIT_TAG
      when: never
    # A scheduled pipeline is the docs-import lane or the Renovate lane.
    # `import_docs`, `publish_docs` and `renovate` are the only jobs that opt
    # in, so a schedule without its variable would make a pipeline with no
    # jobs; refusing it here says why.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $IMPORT_DOCS == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # The nightly import's merge requests (docs/import-*) are started by its project
    # token's bot, which is not a member of the group and so cannot pull
    # through the group dependency proxy: they pull the same digest-pinned
    # images from Docker Hub instead (#13).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^docs\/import-/
      variables:
        CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX: docker.io
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request is tested by that merge request.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Pushes start a pipeline on the long-lived branches only; a working
    # branch's first push would otherwise run twice (orbit #829).
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "dev" && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH !~ /^hotfix\//
      when: never
    # That merge request merges itself as the same bot, so the push pipeline
    # main then gets runs as the bot and its merge commit is the bot's: Docker
    # Hub again (pipeline 2379 failed pulling through the proxy).
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_AUTHOR =~ /project_[0-9]+_bot_/
      variables:
        CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX: docker.io
    - if: $CI_COMMIT_BRANCH

.not_scheduled: &not_scheduled
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

variables:
  # Docker Hub through the group dependency proxy, pinned by digest;
  # Renovate bumps them (renovate.json, the regex manager).
  NODE_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/node:24-bookworm@sha256:9af606de2e947cfb3f276633b7c5130c4cd22365aa10f5a647b7675d5cfce0c0
  # Microsoft's own registry, not proxied. Its tag names the playwright
  # version the `live` job installs; the two must agree.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
  PLAYWRIGHT_VERSION: "1.64.0"

# ---------------------------------------------------------------- lint --
# Every module parses, every file the pages name exists, the docs index
# is whole, nothing stray at the root. tools/ci/lint.sh.
lint:
  stage: lint
  image: $NODE_IMAGE
  variables:
    GIT_DEPTH: 0 # the names guard reads every commit's emails (#56)
    # Node records which lines of the site its tests ran (tools/ci/node-tests.sh);
    # `live:journey` adds Chromium's and checks them against the floors (#14).
    COVERAGE_DIR: coverage
  rules:
    - *not_scheduled
    - when: on_success
  artifacts:
    paths: [coverage/]
    expire_in: 24 hours
  script:
    - npm ci --prefix tools --ignore-scripts --no-audit --no-fund
    - sh tools/ci/lint.sh
    - sh tools/ci/lint-sections-test.sh
    - sh tools/ci/nightly-import-test.sh
    - sh tools/ci/journey-local-test.sh
    - sh tools/ci/door-timing-lookup-test.sh
    - node tools/ci/no-real-names-test.mjs
    - sh tools/ci/node-tests.sh
    - node tools/ci/coverage-test.mjs
    - node tools/ci/import-docs-test.mjs
    - node tools/ci/raw-heading-test.mjs
    - node tools/ci/glow-banding-test.mjs

# The lint's own test: each case plants one fault in a scratch copy and runs
# the whole lint, so it takes about 50 minutes alone. Its own job, beside
# `lint`, so neither runs into the lane's one-hour limit (#62). The gate
# still needs it: the pipeline fails if it does. `live:journey` does not
# wait for it.
lint:test:
  stage: lint
  image: $NODE_IMAGE
  rules:
    - *not_scheduled
    - when: on_success
  script:
    - npm ci --prefix tools --ignore-scripts --no-audit --no-fund
    - sh tools/ci/lint-test.sh

# ---------------------------------------------------------------- live --
# The site served as Pages serves it, visited in Firefox: the door, each
# landing, a docs page, the 404; nothing thrown, nothing missing. This is
# the gate's live check and is never optional, manual or allowed to fail
# (new-project skill: live testing is not optional, owner 2026-09-19).
# Firefox runs headed under Xvfb with Mesa's software GL: headless, it has
# no WebGL and never draws a world, so Firefox-only GPU bugs passed (#4,
# #8). WEBGL=required makes a missing WebGL2 a failure, not a skip. The
# band-upload test then compares banded and whole uploads byte for byte in
# Chromium and Firefox, and the pin test checks a journey pinned at a moment
# (`at`) starts there (#23); the dawn test checks that destroy() cancels a
# first light (#27) and that the Earth's pictures are in before the door reads
# drawn (#28); the asdawn test checks the goodbye wearing the sign-in's face and
# households met again on the way down (#25, #26). The freeze check runs
# Chromium whatever BROWSER says (long tasks are Chromium's): the door tests
# the GPU once, refuses a software renderer, and then freezes nothing (#2).
# The last step is the coverage ratchet (#14): the journey, upload, pin,
# site-browser, phone-door, door-lows, csp, docs-planet, flight-context-loss and
# freeze checks run again in Chromium, which records which of the site's
# JavaScript ran, and with the lint job's Node coverage that is checked against
# tools/ci/coverage-floors.json: a file below its floor fails the job. The
# Chromium runs themselves are not the gate (Firefox's are): one that fails is
# reported and its coverage still counted.
live:journey:
  stage: live
  image:
    name: $PLAYWRIGHT_IMAGE
  needs: [lint]
  rules:
    - *not_scheduled
    - when: on_success
  variables:
    BROWSER: firefox
    HEADED: "1"
    WEBGL: required
    LIBGL_ALWAYS_SOFTWARE: "1"
  script:
    - npm i --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
    - export PLAYWRIGHT_ROOT="$CI_PROJECT_DIR/node_modules/playwright"
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/journey.mjs
    - xvfb-run -a -s "-screen 0 1280x720x24" node tools/ci/upload-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/pin-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/site-browser-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/phone-door-test.mjs
    - node tools/ci/dropped-warning-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/door-lows-test.mjs
    - BROWSER=chromium xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/docs-planet-test.mjs
    - BROWSER=chromium xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/docs-sky-portrait-live-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/flight-context-loss-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/csp-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/dawn-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/asdawn-test.mjs
    - xvfb-run -a -s "-screen 0 1280x800x24" node tools/ci/freeze.mjs
    - COVERAGE_DIR=coverage sh tools/ci/coverage-run.sh browser

# --------------------------------------------------------- maintenance --
# The docs, imported: every night the markdown in Orbit's repositories is
# fetched and set as the site's own pages. What changed goes to `main` as a
# merge request that merges itself once `lint`, `lint:test` and `live:journey` pass, so
# nobody pushes to `main` and every import is tested before Pages serves
# it (owner decisions 1b and 13a, docs/plans/gitlab-migration.md).
# Replaces GitHub's import-docs.yml, which pushed straight to `main`.
#
#
# Two jobs, because the import runs other people's code (the npm packages
# marked and sharp) and the publish holds a secret, and code in a job can read
# that job's secrets and rewrite its scripts (#18). `import_docs` has no token,
# makes no push and no API call, and hands on assets/docs/ alone as an
# artifact. `publish_docs` runs no third-party code, treats the artifact as
# untrusted, checks it, and is the only job in the `docs-import` environment
# (the lint refuses any other).
#
# ORBIT_SITE_IMPORT_TOKEN is a project access token (role Maintainer, scopes
# api and write_repository, Masked + Protected) the owner created, with its
# environment scope set to `docs-import`, which only `publish_docs` joins.
# Nothing here sets it. The schedule runs on `main` with IMPORT_DOCS=true.
import_docs:
  stage: maintenance
  image: $NODE_IMAGE
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $IMPORT_DOCS == "true" && $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_DEPTH: 1
  script:
    - sh tools/ci/nightly-import.sh
  artifacts:
    paths:
      - assets/docs/
    expire_in: 1 day

# The guard on the token is the variable's own settings, not the environment (a
# protected environment is a GitLab Premium feature, and this instance is CE):
# its environment scope is `docs-import`, so only a job that names that
# environment gets it, and its Protect flag limits it to pipelines on protected
# branches. A job joins the environment by a change to this file merged into
# `main` or `dev`, which only a Maintainer can do, and a Maintainer can already
# merge into `main`; the lint refuses any job but `publish_docs` that names
# `docs-import`, so such a change is also visible in review. `action` is left
# at its default, `start`: the scope does not need it (any action matches the
# name), it only records each run as a deployment, a record of when the token
# was used.
# `deployment_tier: other` because nothing is deployed to a server.
#
# `needs` takes no artifacts (artifacts: false): the runner would load any
# dotenv report in them as variables of this job, ahead of this file's own, and
# code in import_docs holds a job token that can upload one. The script fetches
# the archive itself by job id and opens it entry by entry (tools/ci/
# nightly-publish.sh). GIT_STRATEGY: clone makes the checkout a fresh clone, not
# a build folder an earlier job on this runner left things in. The clone does
# not clear the runner's folder beside it, <checkout>.tmp/, which holds the
# .gitlab-runner.ext.conf the checkout's git config includes: the Docker
# executor's per-job build volume is what makes that folder clean. The script
# takes that one include, by its exact path, and nothing else in the folder.
# The job asks GitLab which job to fetch with the import token (a job token
# cannot list a pipeline's jobs) and downloads the archive with its job token.
publish_docs:
  stage: publish
  image: $NODE_IMAGE
  interruptible: false
  needs:
    - job: import_docs
      artifacts: false
  environment:
    name: docs-import
    deployment_tier: other
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $IMPORT_DOCS == "true" && $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_DEPTH: 1
    GIT_STRATEGY: clone
  script:
    - sh tools/ci/nightly-publish.sh

# Renovate, weekly, on a schedule the owner created on `dev` with
# RENOVATE=true. RENOVATE_TOKEN and GITHUB_COM_TOKEN are Masked + Protected,
# scoped to the `renovate` environment, which only this job joins: every other
# job in a dev or main pipeline runs other people's code (npm) and must be
# given nothing. renovate.json has what it watches.
renovate:
  stage: maintenance
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/renovate/renovate:44.151.2@sha256:9ea828b38867af0ca5f269e6c5feace9e74e7f035da150bb16f8c5f70bf2e6e8
    pull_policy: if-not-present
  timeout: 1h
  interruptible: false
  environment:
    name: renovate
    deployment_tier: other
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"
  variables:
    GIT_DEPTH: 1
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_CONFIG_FILE: $CI_PROJECT_DIR/renovate.json
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: "optional"
    LOG_LEVEL: info
  script:
    - renovate
