<!doctype html>
<html lang="en-GB" data-theme="starchart">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not in this world</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#060b1c" />
  <!-- No relative links: Pages serves this file for any missing path, so its
       own location is unknown. Update the home link with the domain. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=JetBrains+Mono:wght@400&display=swap" />
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060b1c;color:#e9edf8;
      font-family:Inter,system-ui,sans-serif;text-align:center;padding:16px;overflow:hidden}
    .stage{position:relative;display:grid;place-items:center;gap:18px}
    svg{overflow:visible}
    .corner{font:10.5px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:#737e9e}
    h1{font:600 clamp(1.6rem,4.5vw,2.6rem)/1.1 "Space Grotesk",Inter,sans-serif;margin:0}
    p{color:#8791b3;margin:0;max-width:34ch}
    a{font:10.5px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#8b95b6;text-decoration:none;margin-top:10px}
    a:hover{color:#d8b45a}
    .tr{animation:spinback 40s linear infinite;transform-origin:100px 100px}
    @keyframes spinback{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.tr{animation:none}}
  </style>
</head>
<body>
  <main class="stage">
    <svg width="160" height="160" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="72" fill="none" stroke="#243259" stroke-width="2" stroke-dasharray="3 5"/>
      <g class="tr"><circle cx="163" cy="63.5" r="6" fill="#d8b45a"/></g>
      <circle cx="100" cy="100" r="6" fill="#ffe9c4" opacity=".9"/>
    </svg>
    <span class="corner">— 404 · uncharted</span>
    <h1>Not in this world.</h1>
    <p>That page isn't on any orbit here. The sky is, though.</p>
    <a href="https://tomlawesome.github.io/orbit-site/">Back to Orbit</a>
  </main>
</body>
</html>
