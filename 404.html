<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit — 404</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05070d" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=JetBrains+Mono:wght@400&display=swap" />
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070d;color:#e7e9ee;font-family:Inter,system-ui,sans-serif;text-align:center;padding:16px}
    .stage{display:grid;place-items:center;gap:18px}
    .corner{font:10.5px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:#717c8e}
    h1{font:600 clamp(1.6rem,4.5vw,2.6rem)/1.1 "Space Grotesk",Inter,sans-serif;margin:0}
    a{font:10.5px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#9fa6b2;text-decoration:none}
    a:hover{color:#7dd3fc}
    .tr{animation:spinback 40s linear infinite;transform-origin:100px 100px}
    @keyframes spinback{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.tr{animation:none}}
  </style>
</head>
<body>
  <main class="stage">
    <svg width="160" height="160" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="72" fill="none" stroke="#1c2434" stroke-width="2" stroke-dasharray="3 5"/><g class="tr"><circle cx="163" cy="63.5" r="6" fill="#d8b45a"/></g></svg>
    <span class="corner">— 404 · uncharted</span>
    <h1>Not in this world.</h1>
    <a href="https://tomlawesome.github.io/orbit-site/">your sky</a>
  </main>
</body>
</html>
