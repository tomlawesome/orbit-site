<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <title>pending</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../assets/door/door.css" />
</head>
<body class="at-door">
  <!-- Driven by tools/ci/dawn-test.mjs (#27, #28): a dawn made through assets/door/index.js alone, as a host makes it.
       window.lightIt(destroyAt, watch) starts and lights it with an after() that never settles (so only the
       13 s backstop can light it), calls destroy() at `destroyAt` ms (or never: null) and answers with when body.lit
       showed and when onLit and onOpen were called, in ms from the call, after `watch` ms. window.drawBegin() starts it
       and watches data-rasterised on the dawn's world; window.drawEnd() answers with when it first read "pending" and
       "ready". -->
  <div id="stage"></div>
  <script type="module">
    import { createDoor, dawnMarkup } from "../assets/door/index.js";

    const image = (path) => `../assets/door/img/${path}`;
    const door = createDoor({ image, flags: {} });
    document.getElementById("stage").innerHTML = dawnMarkup({ image });
    const dawn = door.dawn(document.querySelector("#door"));
    window.dawn = dawn;
    const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));

    window.lightIt = async (destroyAt, watch) => {
      const t0 = performance.now();
      const ms = () => Math.round(performance.now() - t0);
      const at = {}, errors = [];
      const onerror = (e) => errors.push(String(e.message || e));
      const onrejection = (e) => errors.push(String(e.reason && e.reason.message || e.reason));
      addEventListener("error", onerror);
      addEventListener("unhandledrejection", onrejection);
      const look = () => { if (document.body.classList.contains("lit")) at.lit ??= ms(); };
      const watcher = setInterval(look, 50);
      let thrown = null;
      try {
        dawn.start();
        dawn.light({
          firstVisit: false, wait: true,
          after: () => new Promise(() => {}),
          onLit() { at.onLit ??= ms(); },
          onOpen() { at.onOpen ??= ms(); },
        });
        if (typeof destroyAt === "number") { await sleep(destroyAt); dawn.destroy(); at.destroyed = ms(); }
      } catch (e) { thrown = String(e && e.message || e); }
      await sleep(Math.max(0, watch - ms()));
      look();
      clearInterval(watcher);
      removeEventListener("error", onerror);
      removeEventListener("unhandledrejection", onrejection);
      return { at, lit: document.body.classList.contains("lit"), thrown, errors, end: ms() };
    };

    /* drawBegin() starts the dawn and watches its world's data-rasterised; drawNow() says what it reads now; drawEnd()
       says when each value first showed (epoch ms, the same clock as the test runner's) and stops watching. It also
       answers with the page's own record of when "ready" was set and when each Earth picture's response ended (both
       on performance.now(), the page's clock, so the order does not depend on when the runner is told of anything). */
    const seen = {}, drawErrors = [];
    let watcher = null, thrown = null, readyPerf = null;
    const look = () => { const v = dawn.world.dataset.rasterised; if (v) seen[v] ??= Date.now(); if (v === "ready") readyPerf ??= performance.now(); };
    const onerror = (e) => drawErrors.push(String(e.message || e));
    window.drawBegin = () => {
      addEventListener("error", onerror);
      watcher = setInterval(look, 10);
      new MutationObserver(look).observe(dawn.world, { attributes: true, attributeFilter: ["data-rasterised"] });
      try { look(); dawn.start(); look(); } catch (e) { thrown = String(e && e.message || e); }
      return Date.now();
    };
    window.drawNow = () => { look(); return dawn.world.dataset.rasterised ?? null; };
    window.drawEnd = () => {
      look();
      clearInterval(watcher);
      removeEventListener("error", onerror);
      const earth = performance.getEntriesByType("resource")
        .filter((e) => /\/assets\/door\/img\/dawn\/dawn(-pre)?\.webp(\?|$)/.test(e.name))
        .map((e) => ({ url: e.name.replace(/^.*\/assets\//, "assets/"), responseEnd: e.responseEnd }));
      return { seen, now: dawn.world.dataset.rasterised ?? null, thrown, errors: drawErrors, readyPerf, earthEnds: earth };
    };

    /* #27: a destroyed dawn. destroyRun(kind) does one of
         "start"          start() only (the control),
         "start-destroy"  start() then destroy() at once, in the same task,
         "destroy-start"  destroy() then start(),
       and watches the world's data-rasterised from then on: drawLog() answers with every value it has read, each with
       its epoch ms (the runner's clock). */
    const log = [];
    let logWatcher = null;
    const logLook = () => { const v = dawn.world.dataset.rasterised ?? null; if (!log.length || log[log.length - 1].v !== v) log.push({ v, at: Date.now() }); };
    window.destroyRun = (kind) => {
      logLook();
      logWatcher = setInterval(logLook, 10);
      let thrown = null;
      try {
        if (kind === "destroy-start") { dawn.destroy(); dawn.start(); }
        else { dawn.start(); if (kind === "start-destroy") dawn.destroy(); }
      } catch (e) { thrown = String(e && e.message || e); }
      logLook();
      return { thrown, at: Date.now() };
    };
    window.drawLog = () => { logLook(); return log.slice(); };

    /* #27: two lights on one dawn, then destroy() `gap` ms after the second. Answers, at each of `checks` (ms from the
       second light), whether body.loading was on, and at the end when body.lit showed and which callbacks were called. */
    window.twoLights = async (gap, checks, watch) => {
      const t0 = performance.now();
      const ms = () => Math.round(performance.now() - t0);
      const called = [], lit = { at: null }, loading = [], errors = [];
      const onerror = (e) => errors.push(String(e.message || e));
      const onrejection = (e) => errors.push(String(e.reason && e.reason.message || e.reason));
      addEventListener("error", onerror);
      addEventListener("unhandledrejection", onrejection);
      const look = () => { if (document.body.classList.contains("lit")) lit.at ??= ms(); };
      const watcher = setInterval(look, 50);
      let thrown = null, loadingBefore = null, destroyedAt = null;
      try {
        dawn.start();
        for (const n of [1, 2]) {
          dawn.light({
            firstVisit: false, wait: true,
            after: () => new Promise(() => {}),
            onLit() { called.push(`onLit${n}@${ms()}`); },
            onOpen() { called.push(`onOpen${n}@${ms()}`); },
          });
        }
        await sleep(gap);
        loadingBefore = document.body.classList.contains("loading");
        dawn.destroy();
        destroyedAt = ms();
      } catch (e) { thrown = String(e && e.message || e); }
      for (const c of checks) { await sleep(Math.max(0, c - ms())); loading.push({ at: c, on: document.body.classList.contains("loading") }); }
      await sleep(Math.max(0, watch - ms()));
      look();
      clearInterval(watcher);
      removeEventListener("error", onerror);
      removeEventListener("unhandledrejection", onrejection);
      return { called, litAt: lit.at, lit: document.body.classList.contains("lit"), loading, loadingBefore, destroyedAt, thrown, errors, end: ms() };
    };
    /* #28: what the world reads in data-rasterised the moment start() returns (null: nothing yet) */
    window.pendingAtOnce = () => {
      dawn.start();
      return dawn.world.dataset.rasterised ?? null;
    };
    window.dawnReady = true;
  </script>
</body>
</html>
