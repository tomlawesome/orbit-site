# The docs, imported: every night, and on request, the markdown in Orbit's
# repositories is fetched and set as the site's own pages. A change is
# committed to main, and Pages serves it.
name: import docs
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-docs
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund marked@18
      - run: node tools/import-docs.mjs
      - name: commit what changed
        run: |
          git add assets/docs
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Docs: imported from the repositories"
          git push
