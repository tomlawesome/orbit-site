# Paths the shared private-details check (ai/agent-infra#32) allows on
# purpose, each for the named rules only (#94; owner, 2026-10-28, answer 1a).
# Never list commits here.

[[allowlists]]
description = "the development disclosure keeps the tool's name: the site's own line (recorded exception) and the imported docs' disclosures"
targetRules = ["ai-attribution"]
paths = [
  '''^index\.html$''',
  '''^assets/docs/(index|launcher|readme)\.json$''',
]

[[allowlists]]
description = "the same disclosure line, verbatim in English, on the German copy of the install page (#125): the exception lets it move with the page but never be reworded or removed, so it is never translated (no catalogue key). Only that line is allowed: the path and the whole line must both match, so any other credit on the page is still refused (gitleaks hands the line over with the newline before it, hence the \\n?; the regex writes the tool's name with [a], so this file does not match the rule itself)"
targetRules = ["ai-attribution"]
condition = "AND"
paths = ['''^de/index\.html$''']
regexTarget = "line"
regexes = ['''^\n?[ \t]*<p class="made">Designed by a human, written by Cl[a]ude\.</p>[ \t]*$''']

[[allowlists]]
description = "tool names: the assistant's settings folder, and the no-real-names lint's own pattern list"
targetRules = ["ai-attribution"]
paths = [
  '''^AGENTS\.md$''',
  '''^tools/ci/no-real-names\.mjs$''',
]

[[allowlists]]
description = "the copyright holder's name"
targetRules = ["private-surname"]
paths = ['''^LICENSE$''']

[[allowlists]]
description = "made-up addresses: the demo household's relay and the lint's test fixtures"
targetRules = ["email-address"]
paths = [
  '''^assets/js/data\.js$''',
  '''^tools/ci/lint-test\.sh$''',
]

[[allowlists]]
description = "the no-real-names lint's private address ranges and its tests' version-string probes"
targetRules = ["ip-address"]
paths = [
  '''^tools/ci/no-real-names\.mjs$''',
  '''^tools/ci/no-real-names-test\.mjs$''',
]

[[allowlists]]
description = "the lint's tests probe an AI co-author trailer on purpose"
targetRules = ["ai-tool-credit"]
paths = ['''^tools/ci/lint-test\.sh$''']
